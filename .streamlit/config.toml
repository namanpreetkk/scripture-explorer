# Put this file at  .streamlit/config.toml  in your repo (next to app.py).
# It makes Streamlit use the parchment light theme even when the phone/laptop is in dark mode.
[theme]
base = "light"
primaryColor = "#6e1b1b"
backgroundColor = "#f6e7c8"
secondaryBackgroundColor = "#fffaf0"
textColor = "#3b1d0e"
font = "serif"
